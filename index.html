<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILY x HUB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #f5f7fc;
      --header-bg: #ffffff;
      --text: #29477f;
      --muted: #91a2c3;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      background: var(--page-bg);
    }

    .top-header {
      height: 82px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 56px;
      background: var(--header-bg);
      border-bottom: 1px solid #e7ebf3;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      color: #24467f;
      letter-spacing: -0.5px;
    }

    .date-text {
      font-size: 13px;
      color: #8999b8;
    }

    .main-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }

    .mainnet {
      grid-column: 3;
      grid-row: 2;
    }

    .page-card {
      --accent: #526de5;
      --accent-soft: rgba(82, 109, 229, 0.08);

      min-height: 400px;
      padding: 20px;
      border-radius: 19px;
      background: #ffffff;
      border: 1px solid #e4e9f2;
      box-shadow: 0 8px 25px rgba(54, 78, 130, 0.04);
    }

    .task-hub {
      --accent: #526de5;
      --accent-soft: rgba(82, 109, 229, 0.08);
    }

    .daily-task {
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.08);
    }

    .testnet {
      --accent: #159b8c;
      --accent-soft: rgba(21, 155, 140, 0.08);
    }

    .mainnet {
      --accent: #c93ca5;
      --accent-soft: rgba(201, 60, 165, 0.08);
    }

    .page-header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border: 1.5px solid var(--accent);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.7);
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .page-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .item-count {
      color: var(--accent);
      opacity: 0.65;
      font-size: 11px;
      white-space: nowrap;
    }

    .page-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 18px 0 20px;
    }

    .action-btn {
      height: 37px;
      border-radius: 9px;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 10px;
      color: #a6b4cc;
      font-size: 12px;
    }

    .link-item,
    .folder-item {
      width: 100%;
      border: 1.5px solid var(--accent);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.8);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .link-item {
      padding: 8px;
    }

    .link-item.dragging,
    .folder-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .link-item.drag-over,
    .folder-item.drag-over {
      border-style: dashed;
      transform: translateY(-2px);
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .drag-handle {
      width: 18px;
      min-width: 18px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .website-logo {
      width: 26px;
      height: 26px;
      min-width: 26px;
      object-fit: contain;
      border-radius: 6px;
      padding: 3px;
      background: #ffffff;
      border: 1px solid #edf0f6;
    }

    .link-name {
      flex: 1;
      min-width: 0;
      color: #4b6799;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .link-btn {
      height: 26px;
      min-width: 47px;
      padding: 0 8px;
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover {
      opacity: 0.82;
    }

    .folder-item {
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      min-width: 0;
    }

    .folder-icon {
      font-size: 17px;
      line-height: 1;
    }

    .folder-name {
      flex: 1;
      min-width: 0;
      color: #4b6799;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .folder-links {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 0 9px 9px;
    }

    .folder-empty {
      color: #a6b4cc;
      font-size: 10px;
      padding: 2px 0 3px 26px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(30, 47, 82, 0.25);
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(400px, 100%);
      padding: 24px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(30, 50, 100, 0.2);
    }

    .modal h2 {
      margin: 0 0 20px;
      color: #29477f;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #6078a6;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #dce4f2;
      border-radius: 9px;
      outline: none;
      color: #3d5d95;
      font-size: 13px;
    }

    .form-group input:focus {
      border-color: #8da4df;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-btn {
      height: 38px;
      padding: 0 17px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .cancel-btn {
      background: #edf1f8;
      color: #6780ae;
    }

    .save-btn {
      background: var(--modal-accent, #526de5);
      color: #ffffff;
    }

    @media (max-width: 1100px) {
      .main-content {
        padding: 22px;
      }

      .top-header {
        padding: 0 35px;
      }

      .page-card {
        padding: 17px;
      }

      .grid {
        gap: 18px;
      }
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mainnet {
        grid-column: auto;
        grid-row: auto;
      }

      .top-header {
        padding: 0 24px;
      }
    }

    @media (max-width: 560px) {
      .top-header {
        height: 70px;
        padding: 0 18px;
      }

      .brand {
        font-size: 20px;
      }

      .date-text {
        font-size: 10px;
      }

      .main-content {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .page-card {
        min-height: auto;
        padding: 16px;
        border-radius: 16px;
      }

      .page-header {
        height: 50px;
      }

      .empty-state {
        padding: 35px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="top-header">
      <div class="brand">DAILY x HUB</div>
      <div class="date-text" id="currentDate"></div>
    </header>

    <main class="main-content">

      <div class="grid">

        <!-- TASK HUB -->
        <section class="page-card task-hub" data-section="taskHub">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Task Hub
            </div>
            <div class="item-count" id="count-taskHub">0 items</div>
          </div>

          <div class="page-actions">
            <button type="button" class="action-btn add-link-btn" data-section="taskHub">
              + Add Link
            </button>

            <button type="button" class="action-btn create-folder-btn" data-section="taskHub">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-taskHub"></div>

        </section>


        <!-- DAILY TASK -->
        <section class="page-card daily-task" data-section="dailyTask">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Daily Task
            </div>
            <div class="item-count" id="count-dailyTask">0 items</div>
          </div>

          <div class="page-actions">
            <button type="button" class="action-btn add-link-btn" data-section="dailyTask">
              + Add Link
            </button>

            <button type="button" class="action-btn create-folder-btn" data-section="dailyTask">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-dailyTask"></div>

        </section>


        <!-- TESTNET -->
        <section class="page-card testnet" data-section="testnet">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Testnet
            </div>
            <div class="item-count" id="count-testnet">0 items</div>
          </div>

          <div class="page-actions">
            <button type="button" class="action-btn add-link-btn" data-section="testnet">
              + Add Link
            </button>

            <button type="button" class="action-btn create-folder-btn" data-section="testnet">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-testnet"></div>

        </section>


        <!-- MAINNET -->
        <section class="page-card mainnet" data-section="mainnet">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Mainnet
            </div>
            <div class="item-count" id="count-mainnet">0 items</div>
          </div>

          <div class="page-actions">
            <button type="button" class="action-btn add-link-btn" data-section="mainnet">
              + Add Link
            </button>

            <button type="button" class="action-btn create-folder-btn" data-section="mainnet">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-mainnet"></div>

        </section>

      </div>

    </main>

  </div>


  <!-- ADD LINK MODAL -->
  <div class="modal-overlay" id="linkModal">

    <div class="modal">

      <h2>Add New Link</h2>

      <div class="form-group">
        <label for="websiteName">Website Name</label>
        <input
          type="text"
          id="websiteName"
          placeholder="e.g. Axis Robotics"
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="websiteUrl">Website URL</label>
        <input
          type="text"
          id="websiteUrl"
          placeholder="https://example.com"
          autocomplete="off"
        >
      </div>

      <div class="modal-actions">
        <button type="button" class="modal-btn cancel-btn" id="cancelLinkBtn">
          Cancel
        </button>

        <button type="button" class="modal-btn save-btn" id="saveLinkBtn">
          Save Link
        </button>
      </div>

    </div>

  </div>


  <!-- CREATE FOLDER MODAL -->
  <div class="modal-overlay" id="folderModal">

    <div class="modal">

      <h2>Create Folder</h2>

      <div class="form-group">
        <label for="folderName">Folder Name</label>
        <input
          type="text"
          id="folderName"
          placeholder="e.g. Important Projects"
          autocomplete="off"
        >
      </div>

      <div class="modal-actions">
        <button type="button" class="modal-btn cancel-btn" id="cancelFolderBtn">
          Cancel
        </button>

        <button type="button" class="modal-btn save-btn" id="saveFolderBtn">
          Create Folder
        </button>
      </div>

    </div>

  </div>


  <script>
    const STORAGE_KEY = "daily_x_hub_data";

    const defaultData = {
      taskHub: [],
      dailyTask: [],
      testnet: [],
      mainnet: []
    };

    let data = loadData();

    let currentSection = null;
    let currentFolderIndex = null;

    let draggedElement = null;
    let draggedType = null;
    let draggedSection = null;
    let draggedFolderIndex = null;
    let draggedItemIndex = null;


    /* DATE */

    function setDate() {
      const date = new Date();

      document.getElementById("currentDate").textContent =
        date.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
    }


    /* STORAGE */

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return structuredClone(defaultData);
        }

        const parsed = JSON.parse(saved);
        const result = structuredClone(defaultData);

        Object.keys(result).forEach(section => {

          if (!Array.isArray(parsed[section])) return;

          result[section] = parsed[section].map(item => {

            if (item.type === "folder") {
              return {
                type: "folder",
                name: item.name || "Untitled Folder",
                links: Array.isArray(item.links)
                  ? item.links.map(link => ({
                      name: link.name || "Untitled Link",
                      url: link.url || ""
                    }))
                  : []
              };
            }

            return {
              type: "link",
              name: item.name || "Untitled Link",
              url: item.url || ""
            };
          });

        });

        return result;

      } catch (error) {
        console.error("Storage error:", error);
        return structuredClone(defaultData);
      }
    }


    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }


    /* URL HELPERS */

    function normalizeUrl(url) {
      url = url.trim();

      if (!url) return "";

      if (!/^https?:\/\//i.test(url)) {
        return "https://" + url;
      }

      return url;
    }


    function getHostname(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return "";
      }
    }


    function getFavicon(url) {
      const hostname = getHostname(url);

      if (!hostname) return "";

      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=64`;
    }


    /* COUNT */

    function countItems(items) {
      let count = 0;

      items.forEach(item => {
        if (item.type === "folder") {
          count += item.links.length;
        } else {
          count++;
        }
      });

      return count;
    }


    /* RENDER */

    function renderAll() {
      Object.keys(data).forEach(section => {
        renderSection(section);
      });
    }


    function renderSection(section) {

      const list = document.getElementById(`list-${section}`);
      const count = document.getElementById(`count-${section}`);

      list.innerHTML = "";

      count.textContent = `${countItems(data[section])} items`;

      if (data[section].length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No items yet";

        list.appendChild(empty);
        return;
      }

      data[section].forEach((item, index) => {

        if (item.type === "folder") {

          list.appendChild(
            createFolderElement(section, index, item)
          );

        } else {

          list.appendChild(
            createLinkElement(section, item, index, null)
          );

        }

      });

    }


    /* LINK ELEMENT */

    function createLinkElement(section, link, linkIndex, folderIndex) {

      const item = document.createElement("div");

      item.className = "link-item";

      const row = document.createElement("div");
      row.className = "link-row";


      const dragHandle = document.createElement("div");
      dragHandle.className = "drag-handle";
      dragHandle.textContent = "⠿";
      dragHandle.title = "Drag to reorder";


      const logo = document.createElement("img");
      logo.className = "website-logo";
      logo.src = getFavicon(link.url);
      logo.alt = "";
      logo.loading = "lazy";

      logo.onerror = function () {
        this.style.display = "none";
      };


      const name = document.createElement("div");
      name.className = "link-name";
      name.textContent = link.name;


      const buttons = document.createElement("div");
      buttons.className = "link-buttons";


      const openBtn = document.createElement("button");
      openBtn.type = "button";
      openBtn.className = "link-btn";
      openBtn.textContent = "Open";

      openBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        const url = normalizeUrl(link.url);

        if (url) {
          window.open(url, "_blank", "noopener,noreferrer");
        }

      });


      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "link-btn";
      deleteBtn.textContent = "Delete";

      deleteBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        deleteLink(section, linkIndex, folderIndex);

      });


      buttons.appendChild(openBtn);
      buttons.appendChild(deleteBtn);

      row.appendChild(dragHandle);
      row.appendChild(logo);
      row.appendChild(name);
      row.appendChild(buttons);

      item.appendChild(row);


      setupDragEvents(
        item,
        dragHandle,
        "link",
        section,
        folderIndex,
        linkIndex
      );

      return item;
    }


    /* FOLDER ELEMENT */

    function createFolderElement(section, folderIndex, folder) {

      const folderItem = document.createElement("div");

      folderItem.className = "folder-item";


      const header = document.createElement("div");
      header.className = "folder-header";


      const handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "⠿";
      handle.title = "Drag to reorder folder";


      const icon = document.createElement("div");
      icon.className = "folder-icon";
      icon.textContent = "📁";


      const name = document.createElement("div");
      name.className = "folder-name";
      name.textContent = folder.name;


      const actions = document.createElement("div");
      actions.className = "folder-actions";


      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "link-btn";
      addBtn.textContent = "Add Link";

      addBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openLinkModal(section, folderIndex);

      });


      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "link-btn";
      deleteBtn.textContent = "Delete Folder";

      deleteBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        deleteFolder(section, folderIndex);

      });


      actions.appendChild(addBtn);
      actions.appendChild(deleteBtn);

      header.appendChild(handle);
      header.appendChild(icon);
      header.appendChild(name);
      header.appendChild(actions);

      folderItem.appendChild(header);


      const folderLinks = document.createElement("div");
      folderLinks.className = "folder-links";


      if (folder.links.length === 0) {

        const empty = document.createElement("div");
        empty.className = "folder-empty";
        empty.textContent = "No links in this folder";

        folderLinks.appendChild(empty);

      } else {

        folder.links.forEach((link, linkIndex) => {

          folderLinks.appendChild(
            createLinkElement(
              section,
              link,
              linkIndex,
              folderIndex
            )
          );

        });

      }

      folderItem.appendChild(folderLinks);


      setupDragEvents(
        folderItem,
        handle,
        "folder",
        section,
        null,
        folderIndex
      );

      return folderItem;
    }


    /* DRAG EVENTS */

    function setupDragEvents(
      element,
      handle,
      type,
      section,
      folderIndex,
      itemIndex
    ) {

      handle.draggable = true;


      handle.addEventListener("dragstart", function(event) {

        draggedElement = element;
        draggedType = type;
        draggedSection = section;
        draggedFolderIndex = folderIndex;
        draggedItemIndex = itemIndex;

        element.classList.add("dragging");

        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", "drag");

      });


      handle.addEventListener("dragend", function() {

        element.classList.remove("dragging");

        document.querySelectorAll(".drag-over").forEach(el => {
          el.classList.remove("drag-over");
        });

        draggedElement = null;
        draggedType = null;
        draggedSection = null;
        draggedFolderIndex = null;
        draggedItemIndex = null;

      });


      element.addEventListener("dragover", function(event) {

        event.preventDefault();

        if (!draggedElement || draggedElement === element) return;

        if (draggedSection !== section) return;

        if (draggedType !== type) return;

        if (
          type === "link" &&
          draggedFolderIndex !== folderIndex
        ) {
          return;
        }

        element.classList.add("drag-over");

        const rect = element.getBoundingClientRect();
        const middle = rect.top + rect.height / 2;

        if (event.clientY < middle) {

          element.parentNode.insertBefore(
            draggedElement,
            element
          );

        } else {

          element.parentNode.insertBefore(
            draggedElement,
            element.nextSibling
          );

        }

      });


      element.addEventListener("dragleave", function() {
        element.classList.remove("drag-over");
      });


      element.addEventListener("drop", function(event) {

        event.preventDefault();

        if (!draggedElement) return;

        element.classList.remove("drag-over");

        reorderItems(
          draggedSection,
          draggedType,
          draggedFolderIndex,
          draggedItemIndex,
          section,
          folderIndex,
          itemIndex
        );

      });

    }


    /* REORDER */

    function reorderItems(
      fromSection,
      fromType,
      fromFolderIndex,
      fromItemIndex,
      toSection,
      toFolderIndex,
      toItemIndex
    ) {

      if (fromSection !== toSection) return;


      if (fromType === "link") {

        if (fromFolderIndex !== toFolderIndex) return;

        const collection =
          fromFolderIndex === null
            ? data[fromSection]
            : data[fromSection][fromFolderIndex].links;

        const [moved] = collection.splice(fromItemIndex, 1);

        let newIndex = toItemIndex;

        if (fromItemIndex < toItemIndex) {
          newIndex--;
        }

        collection.splice(newIndex, 0, moved);
      }


      if (fromType === "folder") {

        const [moved] = data[fromSection].splice(
          fromItemIndex,
          1
        );

        let newIndex = toItemIndex;

        if (fromItemIndex < toItemIndex) {
          newIndex--;
        }

        data[fromSection].splice(newIndex, 0, moved);
      }


      saveData();
      renderAll();

    }


    /* LINK MODAL */

    function openLinkModal(section, folderIndex = null) {

      currentSection = section;
      currentFolderIndex = folderIndex;

      const modal = document.getElementById("linkModal");

      const card = document.querySelector(
        `.page-card[data-section="${section}"]`
      );

      const accent = getComputedStyle(card)
        .getPropertyValue("--accent")
        .trim();

      modal.querySelector(".save-btn").style.setProperty(
        "--modal-accent",
        accent
      );

      document.getElementById("websiteName").value = "";
      document.getElementById("websiteUrl").value = "";

      modal.classList.add("active");

      setTimeout(function() {
        document.getElementById("websiteName").focus();
      }, 100);

    }


    function closeLinkModal() {

      document
        .getElementById("linkModal")
        .classList.remove("active");

      currentSection = null;
      currentFolderIndex = null;

    }


    function saveLink() {

      const nameInput = document.getElementById("websiteName");
      const urlInput = document.getElementById("websiteUrl");

      const name = nameInput.value.trim();
      const url = normalizeUrl(urlInput.value);

      if (!name) {
        alert("Please enter a website name.");
        nameInput.focus();
        return;
      }

      if (!url) {
        alert("Please enter a website URL.");
        urlInput.focus();
        return;
      }


      if (currentFolderIndex === null) {

        data[currentSection].push({
          type: "link",
          name,
          url
        });

      } else {

        data[currentSection][currentFolderIndex].links.push({
          name,
          url
        });

      }

      saveData();
      renderAll();
      closeLinkModal();

    }


    /* FOLDER MODAL */

    function openFolderModal(section) {

      currentSection = section;

      const modal = document.getElementById("folderModal");

      const card = document.querySelector(
        `.page-card[data-section="${section}"]`
      );

      const accent = getComputedStyle(card)
        .getPropertyValue("--accent")
        .trim();

      modal.querySelector(".save-btn").style.setProperty(
        "--modal-accent",
        accent
      );

      document.getElementById("folderName").value = "";

      modal.classList.add("active");

      setTimeout(function() {
        document.getElementById("folderName").focus();
      }, 100);

    }


    function closeFolderModal() {

      document
        .getElementById("folderModal")
        .classList.remove("active");

      currentSection = null;

    }


    function saveFolder() {

      const nameInput = document.getElementById("folderName");
      const name = nameInput.value.trim();

      if (!name) {
        alert("Please enter a folder name.");
        nameInput.focus();
        return;
      }

      data[currentSection].push({
        type: "folder",
        name,
        links: []
      });

      saveData();
      renderAll();
      closeFolderModal();

    }


    /* DELETE LINK */

    function deleteLink(section, linkIndex, folderIndex = null) {

      const shouldDelete = confirm(
        "Are you sure you want to delete this link?"
      );

      if (!shouldDelete) return;


      if (folderIndex === null) {

        data[section].splice(linkIndex, 1);

      } else {

        if (
          data[section][folderIndex] &&
          Array.isArray(data[section][folderIndex].links)
        ) {
          data[section][folderIndex].links.splice(linkIndex, 1);
        }

      }

      saveData();
      renderAll();

    }


    /* DELETE FOLDER */

    function deleteFolder(section, folderIndex) {

      const shouldDelete = confirm(
        "Delete this folder and all links inside it?"
      );

      if (!shouldDelete) return;

      if (
        data[section] &&
        data[section][folderIndex]
      ) {
        data[section].splice(folderIndex, 1);
      }

      saveData();
      renderAll();

    }


    /* MAIN BUTTONS */

    document.querySelectorAll(".add-link-btn").forEach(function(button) {

      button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openLinkModal(button.dataset.section);

      });

    });


    document.querySelectorAll(".create-folder-btn").forEach(function(button) {

      button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openFolderModal(button.dataset.section);

      });

    });


    /* MODAL EVENTS */

    document
      .getElementById("cancelLinkBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeLinkModal();

      });


    document
      .getElementById("saveLinkBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        saveLink();

      });


    document
      .getElementById("cancelFolderBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeFolderModal();

      });


    document
      .getElementById("saveFolderBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        saveFolder();

      });


    /* ENTER KEY SUPPORT */

    document
      .getElementById("websiteName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          document.getElementById("websiteUrl").focus();
        }

      });


    document
      .getElementById("websiteUrl")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          saveLink();
        }

      });


    document
      .getElementById("folderName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          saveFolder();
        }

      });


    /* CLOSE MODALS OUTSIDE CLICK */

    document
      .getElementById("linkModal")
      .addEventListener("click", function(event) {

        if (event.target.id === "linkModal") {
          closeLinkModal();
        }

      });


    document
      .getElementById("folderModal")
      .addEventListener("click", function(event) {

        if (event.target.id === "folderModal") {
          closeFolderModal();
        }

      });


    /* INITIALIZE */

    setDate();
    renderAll();

  </script>

</body>
</html>
