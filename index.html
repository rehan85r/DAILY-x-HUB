<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILY x HUB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f6f8fc;
      --text: #29477f;
      --muted: #92a2c0;
      --card-border: #e5eaf3;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      width: 100%;
    }

    /* HEADER */

    .top-header {
      height: 82px;
      padding: 0 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 1px solid #e7ebf3;
    }

    .brand {
      color: #24467f;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .date-text {
      color: #8999b8;
      font-size: 13px;
    }

    /* MAIN LAYOUT */

    .main-content {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: auto auto;
      gap: 24px;
      align-items: stretch;
    }

    /* REQUIRED LAYOUT
       LEFT: Task Hub
       CENTER: Testnet / Mainnet
       RIGHT: Daily Task
    */

    .task-hub {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    .testnet {
      grid-column: 2;
      grid-row: 1;
    }

    .mainnet {
      grid-column: 2;
      grid-row: 2;
    }

    .daily-task {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    /* PAGE COLORS */

    .page-card {
      --accent: #526de5;

      min-height: 400px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 19px;
      box-shadow: 0 8px 25px rgba(54, 78, 130, 0.04);
    }

    .task-hub {
      --accent: #526de5;
    }

    .daily-task {
      --accent: #8b5cf6;
    }

    .testnet {
      --accent: #159b8c;
    }

    .mainnet {
      --accent: #c93ca5;
    }

    /* PAGE HEADER */

    .page-header {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid var(--accent);
      border-radius: 13px;
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .page-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
    }

    .item-count {
      color: var(--accent);
      opacity: 0.65;
      font-size: 11px;
      white-space: nowrap;
    }

    /* MAIN BUTTONS */

    .page-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 18px 0 20px;
    }

    .action-btn {
      height: 37px;
      border-radius: 9px;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    /* ITEMS */

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .empty-state {
      padding: 60px 10px;
      text-align: center;
      color: #a6b4cc;
      font-size: 12px;
    }

    /* LINK CARD */

    .link-item,
    .folder-item {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid var(--accent);
      border-radius: 11px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .link-item {
      padding: 8px;
    }

    .link-item.dragging,
    .folder-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .link-item.drag-over,
    .folder-item.drag-over {
      border-style: dashed;
      transform: translateY(-2px);
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    /* DRAG HANDLE */

    .drag-handle {
      width: 18px;
      min-width: 18px;
      color: var(--accent);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* WEBSITE LOGO */

    .website-logo {
      width: 28px;
      height: 28px;
      min-width: 28px;
      object-fit: contain;
      padding: 3px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #edf0f6;
    }

    .link-name {
      flex: 1;
      min-width: 0;
      color: #4b6799;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .link-btn {
      height: 28px;
      min-width: 48px;
      padding: 0 8px;
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover {
      opacity: 0.82;
    }

    /* PREMIUM FOLDER */

    .folder-item {
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 9px;
    }

    .folder-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .folder-icon svg {
      display: block;
      width: 42px;
      height: 42px;
      overflow: visible;
    }

    .folder-name {
      flex: 1;
      min-width: 0;
      color: #4b6799;
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .folder-links {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 0 9px 9px;
    }

    .folder-empty {
      padding: 2px 0 3px 26px;
      color: #a6b4cc;
      font-size: 10px;
    }

    /* MODALS */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(30, 47, 82, 0.25);
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(400px, 100%);
      padding: 24px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(30, 50, 100, 0.2);
    }

    .modal h2 {
      margin: 0 0 20px;
      color: #29477f;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #6078a6;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      outline: none;
      border: 1px solid #dce4f2;
      border-radius: 9px;
      color: #3d5d95;
      font-size: 13px;
    }

    .form-group input:focus {
      border-color: #8da4df;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-btn {
      height: 38px;
      padding: 0 17px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .cancel-btn {
      background: #edf1f8;
      color: #6780ae;
    }

    .save-btn {
      background: var(--modal-accent, #526de5);
      color: #ffffff;
    }

    /* RESPONSIVE */

    @media (max-width: 1100px) {
      .top-header {
        padding: 0 35px;
      }

      .main-content {
        padding: 22px;
      }

      .grid {
        gap: 18px;
      }

      .page-card {
        padding: 17px;
      }
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto auto;
      }

      .task-hub {
        grid-column: 1;
        grid-row: 1 / 3;
      }

      .testnet {
        grid-column: 2;
        grid-row: 1;
      }

      .mainnet {
        grid-column: 2;
        grid-row: 2;
      }

      .daily-task {
        grid-column: 1 / 3;
        grid-row: 3;
      }
    }

    @media (max-width: 560px) {
      .top-header {
        height: 70px;
        padding: 0 18px;
      }

      .brand {
        font-size: 20px;
      }

      .date-text {
        font-size: 10px;
      }

      .main-content {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 14px;
      }

      .task-hub,
      .testnet,
      .mainnet,
      .daily-task {
        grid-column: auto;
        grid-row: auto;
      }

      .page-card {
        min-height: auto;
        padding: 16px;
        border-radius: 16px;
      }

      .page-header {
        height: 50px;
      }

      .empty-state {
        padding: 35px 10px;
      }
    }


    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sync-btn {
      height: 38px;
      padding: 0 14px;
      border: 1px solid #526de5;
      border-radius: 9px;
      background: #526de5;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .sync-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .sync-modal {
      width: min(430px, 100%);
    }

    .sync-description {
      margin: -8px 0 18px;
      color: #92a2c0;
      font-size: 11px;
      line-height: 1.6;
    }

    .sync-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .sync-action-btn {
      height: 42px;
      border: 1px solid #dce4f2;
      border-radius: 9px;
      background: #ffffff;
      color: #526b9c;
      font-size: 11px;
      font-weight: 700;
    }

    .sync-action-btn.primary {
      background: #526de5;
      border-color: #526de5;
      color: #ffffff;
    }

    .google-btn {
      width: 100%;
      height: 42px;
      margin-top: 9px;
      border: 1px solid #dce4f2;
      border-radius: 9px;
      background: #ffffff;
      color: #526b9c;
      font-size: 11px;
      font-weight: 700;
    }

    .sync-note {
      margin-top: 15px;
      padding: 10px;
      border-radius: 9px;
      background: #f6f8fc;
      color: #92a2c0;
      font-size: 10px;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .top-header {
        padding: 0 14px;
      }

      .header-right {
        gap: 7px;
      }

      .date-text {
        display: none;
      }

      .sync-btn {
        padding: 0 10px;
        font-size: 10px;
      }
    }

    /* SYNC & BACKUP */
    .backup-bar {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      margin-top:18px;
      flex-wrap:wrap;
    }
    .backup-btn {
      height:36px;
      padding:0 12px;
      border:1px solid #dce4f2;
      border-radius:9px;
      background:#fff;
      color:#526b9c;
      font-size:11px;
      font-weight:700;
    }
    .backup-btn.primary { background:#526de5; border-color:#526de5; color:#fff; }
    .backup-btn:hover { opacity:.85; }
    .backup-status { width:100%; text-align:right; color:#92a2c0; font-size:10px; }

  </style>
</head>

<body>

  <div class="app">

    <header class="top-header">
      <div class="brand">DAILY x HUB</div>
      <div class="header-right">
        <div class="date-text" id="currentDate"></div>
        <button type="button" class="sync-btn" id="syncBackupBtn">Sync &amp; Backup</button>
      </div>
    </header>

    <main class="main-content">

      <div class="grid">

        <!-- LEFT: TASK HUB -->
        <section class="page-card task-hub" data-section="taskHub">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Task Hub
            </div>

            <div class="item-count" id="count-taskHub">
              0 items
            </div>
          </div>

          <div class="page-actions">
            <button
              type="button"
              class="action-btn add-link-btn"
              data-section="taskHub">
              + Add Link
            </button>

            <button
              type="button"
              class="action-btn create-folder-btn"
              data-section="taskHub">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-taskHub"></div>

        </section>


        <!-- CENTER TOP: TESTNET -->
        <section class="page-card testnet" data-section="testnet">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Testnet
            </div>

            <div class="item-count" id="count-testnet">
              0 items
            </div>
          </div>

          <div class="page-actions">
            <button
              type="button"
              class="action-btn add-link-btn"
              data-section="testnet">
              + Add Link
            </button>

            <button
              type="button"
              class="action-btn create-folder-btn"
              data-section="testnet">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-testnet"></div>

        </section>


        <!-- CENTER BOTTOM: MAINNET -->
        <section class="page-card mainnet" data-section="mainnet">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Mainnet
            </div>

            <div class="item-count" id="count-mainnet">
              0 items
            </div>
          </div>

          <div class="page-actions">
            <button
              type="button"
              class="action-btn add-link-btn"
              data-section="mainnet">
              + Add Link
            </button>

            <button
              type="button"
              class="action-btn create-folder-btn"
              data-section="mainnet">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-mainnet"></div>

        </section>


        <!-- RIGHT: DAILY TASK -->
        <section class="page-card daily-task" data-section="dailyTask">

          <div class="page-header">
            <div class="page-title">
              <span class="page-dot"></span>
              Daily Task
            </div>

            <div class="item-count" id="count-dailyTask">
              0 items
            </div>
          </div>

          <div class="page-actions">
            <button
              type="button"
              class="action-btn add-link-btn"
              data-section="dailyTask">
              + Add Link
            </button>

            <button
              type="button"
              class="action-btn create-folder-btn"
              data-section="dailyTask">
              + Create Folder
            </button>
          </div>

          <div class="items-list" id="list-dailyTask"></div>

        </section>
      </div>

    </main>

  </div>


  <!-- ADD LINK MODAL -->

  <div class="modal-overlay" id="linkModal">

    <div class="modal">

      <h2>Add New Link</h2>

      <div class="form-group">
        <label for="websiteName">Website Name</label>

        <input
          type="text"
          id="websiteName"
          placeholder="e.g. Axis Robotics"
          autocomplete="off">
      </div>

      <div class="form-group">
        <label for="websiteUrl">Website URL</label>

        <input
          type="text"
          id="websiteUrl"
          placeholder="https://example.com"
          autocomplete="off">
      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="modal-btn cancel-btn"
          id="cancelLinkBtn">
          Cancel
        </button>

        <button
          type="button"
          class="modal-btn save-btn"
          id="saveLinkBtn">
          Save Link
        </button>

      </div>

    </div>

  </div>


  <!-- CREATE FOLDER MODAL -->

  <div class="modal-overlay" id="folderModal">

    <div class="modal">

      <h2>Create Folder</h2>

      <div class="form-group">
        <label for="folderName">Folder Name</label>

        <input
          type="text"
          id="folderName"
          placeholder="e.g. Important Projects"
          autocomplete="off">
      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="modal-btn cancel-btn"
          id="cancelFolderBtn">
          Cancel
        </button>

        <button
          type="button"
          class="modal-btn save-btn"
          id="saveFolderBtn">
          Create Folder
        </button>

      </div>

    </div>

  </div>



  <!-- SYNC & BACKUP MODAL -->
  <div class="modal-overlay" id="syncModal">
    <div class="modal sync-modal">
      <h2>Sync &amp; Backup</h2>
      <p class="sync-description">
        Export your DAILY x HUB data as a backup file or import an existing backup.
      </p>

      <div class="sync-actions">
        <button type="button" class="sync-action-btn primary" id="modalExportBackupBtn">
          Export Backup
        </button>
        <button type="button" class="sync-action-btn" id="modalImportBackupBtn">
          Import Backup
        </button>
      </div>

      <input type="file" id="modalBackupFileInput" accept=".json,application/json" hidden>

      <button type="button" class="google-btn" id="googleSignInBtn">
        Sign In with Google
      </button>

      <div class="sync-note" id="syncModalStatus">
        Local data is saved automatically on this device.
      </div>

      <div class="modal-actions">
        <button type="button" class="modal-btn cancel-btn" id="closeSyncBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "daily_x_hub_data";

    const defaultData = {
      taskHub: [],
      dailyTask: [],
      testnet: [],
      mainnet: []
    };

    let data = loadData();

    let currentSection = null;
    let currentFolderIndex = null;

    let draggedElement = null;
    let draggedType = null;
    let draggedSection = null;
    let draggedFolderIndex = null;
    let draggedItemIndex = null;


    /* DATE */

    function setDate() {
      const date = new Date();

      document.getElementById("currentDate").textContent =
        date.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
    }


    /* STORAGE */

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return JSON.parse(JSON.stringify(defaultData));
        }

        const parsed = JSON.parse(saved);
        const result = JSON.parse(JSON.stringify(defaultData));

        Object.keys(result).forEach(section => {

          if (!Array.isArray(parsed[section])) {
            return;
          }

          result[section] = parsed[section].map(item => {

            if (item.type === "folder") {

              return {
                type: "folder",
                name: item.name || "Untitled Folder",
                links: Array.isArray(item.links)
                  ? item.links.map(link => ({
                      name: link.name || "Untitled Link",
                      url: link.url || ""
                    }))
                  : []
              };

            }

            return {
              type: "link",
              name: item.name || "Untitled Link",
              url: item.url || ""
            };

          });

        });

        return result;

      } catch (error) {
        console.error("Unable to load saved data:", error);
        return JSON.parse(JSON.stringify(defaultData));
      }
    }


    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }


    /* URL */

    function normalizeUrl(url) {
      url = url.trim();

      if (!url) {
        return "";
      }

      if (!/^https?:\/\//i.test(url)) {
        return "https://" + url;
      }

      return url;
    }


    function getHostname(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return "";
      }
    }


    function getFavicon(url) {
      const hostname = getHostname(url);

      if (!hostname) {
        return "";
      }

      return (
        "https://www.google.com/s2/favicons?domain=" +
        encodeURIComponent(hostname) +
        "&sz=128"
      );
    }


    /* PREMIUM FOLDER ICON */

    function createPremiumFolderIcon() {

      const wrapper = document.createElement("div");
      wrapper.className = "folder-icon";

      wrapper.innerHTML = `
        <svg
          viewBox="0 0 64 64"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">

          <defs>
            <linearGradient
              id="premiumFolderGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="1">

              <stop offset="0%" stop-color="#FFE08A"/>
              <stop offset="45%" stop-color="#FFC94F"/>
              <stop offset="100%" stop-color="#F3A51F"/>

            </linearGradient>
          </defs>

          <path
            d="M5 18C5 14.7 7.7 12 11 12H25L31 19H53C56.3 19 59 21.7 59 25V50C59 53.3 56.3 56 53 56H11C7.7 56 5 53.3 5 50V18Z"
            fill="url(#premiumFolderGradient)"
            stroke="#E2A32A"
            stroke-width="1.5"/>

          <path
            d="M5 23C5 19.7 7.7 17 11 17H53C56.3 17 59 19.7 59 23V27H5V23Z"
            fill="#FFD86B"/>

          <path
            d="M7 27H57V49C57 51.2 55.2 53 53 53H11C8.8 53 7 51.2 7 49V27Z"
            fill="url(#premiumFolderGradient)"/>

          <path
            d="M8 28H56"
            stroke="#E8A82B"
            stroke-width="1"
            opacity="0.6"/>

          <path
            d="M13 20H25"
            stroke="#FFE89A"
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.9"/>

        </svg>
      `;

      return wrapper;
    }


    /* COUNT */

    function countItems(items) {
      let count = 0;

      items.forEach(item => {

        if (item.type === "folder") {
          count += item.links.length;
        } else {
          count++;
        }

      });

      return count;
    }


    /* RENDER */

    function renderAll() {
      Object.keys(data).forEach(section => {
        renderSection(section);
      });
    }


    function renderSection(section) {

      const list = document.getElementById(`list-${section}`);
      const count = document.getElementById(`count-${section}`);

      list.innerHTML = "";

      count.textContent = `${countItems(data[section])} items`;

      if (data[section].length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No items yet";

        list.appendChild(empty);

        return;
      }

      data[section].forEach((item, index) => {

        if (item.type === "folder") {

          list.appendChild(
            createFolderElement(section, index, item)
          );

        } else {

          list.appendChild(
            createLinkElement(section, item, index, null)
          );

        }

      });

    }


    /* LINK ELEMENT */

    function createLinkElement(
      section,
      link,
      linkIndex,
      folderIndex
    ) {

      const item = document.createElement("div");
      item.className = "link-item";

      const row = document.createElement("div");
      row.className = "link-row";


      const dragHandle = document.createElement("div");
      dragHandle.className = "drag-handle";
      dragHandle.textContent = "⠿";
      dragHandle.title = "Drag to reorder";


      const logo = document.createElement("img");
      logo.className = "website-logo";
      logo.src = getFavicon(link.url);
      logo.alt = link.name;
      logo.loading = "lazy";

      logo.onerror = function () {
        this.style.display = "none";
      };


      const name = document.createElement("div");
      name.className = "link-name";
      name.textContent = link.name;


      const buttons = document.createElement("div");
      buttons.className = "link-buttons";


      const openBtn = document.createElement("button");
      openBtn.type = "button";
      openBtn.className = "link-btn";
      openBtn.textContent = "Open";

      openBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        const url = normalizeUrl(link.url);

        if (url) {
          window.open(url, "_blank", "noopener,noreferrer");
        }

      });


      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "link-btn";
      deleteBtn.textContent = "Delete";

      deleteBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        deleteLink(section, linkIndex, folderIndex);

      });


      buttons.appendChild(openBtn);
      buttons.appendChild(deleteBtn);

      row.appendChild(dragHandle);
      row.appendChild(logo);
      row.appendChild(name);
      row.appendChild(buttons);

      item.appendChild(row);


      setupDragEvents(
        item,
        dragHandle,
        "link",
        section,
        folderIndex,
        linkIndex
      );

      return item;
    }


    /* FOLDER ELEMENT */

    function createFolderElement(section, folderIndex, folder) {

      const folderItem = document.createElement("div");
      folderItem.className = "folder-item";


      const header = document.createElement("div");
      header.className = "folder-header";


      const handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "⠿";
      handle.title = "Drag to reorder folder";


      const icon = createPremiumFolderIcon();


      const name = document.createElement("div");
      name.className = "folder-name";
      name.textContent = folder.name;


      const actions = document.createElement("div");
      actions.className = "folder-actions";


      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "link-btn";
      addBtn.textContent = "Add Link";

      addBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openLinkModal(section, folderIndex);

      });


      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "link-btn";
      deleteBtn.textContent = "Delete Folder";

      deleteBtn.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        deleteFolder(section, folderIndex);

      });


      actions.appendChild(addBtn);
      actions.appendChild(deleteBtn);

      header.appendChild(handle);
      header.appendChild(icon);
      header.appendChild(name);
      header.appendChild(actions);

      folderItem.appendChild(header);


      const folderLinks = document.createElement("div");
      folderLinks.className = "folder-links";


      if (folder.links.length === 0) {

        const empty = document.createElement("div");
        empty.className = "folder-empty";
        empty.textContent = "No links in this folder";

        folderLinks.appendChild(empty);

      } else {

        folder.links.forEach((link, linkIndex) => {

          folderLinks.appendChild(
            createLinkElement(
              section,
              link,
              linkIndex,
              folderIndex
            )
          );

        });

      }


      folderItem.appendChild(folderLinks);


      setupDragEvents(
        folderItem,
        handle,
        "folder",
        section,
        null,
        folderIndex
      );

      return folderItem;
    }


    /* DRAG EVENTS */

    function setupDragEvents(
      element,
      handle,
      type,
      section,
      folderIndex,
      itemIndex
    ) {

      handle.draggable = true;


      handle.addEventListener("dragstart", function(event) {

        draggedElement = element;
        draggedType = type;
        draggedSection = section;
        draggedFolderIndex = folderIndex;
        draggedItemIndex = itemIndex;

        element.classList.add("dragging");

        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", "drag");

      });


      handle.addEventListener("dragend", function() {

        element.classList.remove("dragging");

        document.querySelectorAll(".drag-over").forEach(el => {
          el.classList.remove("drag-over");
        });

        draggedElement = null;
        draggedType = null;
        draggedSection = null;
        draggedFolderIndex = null;
        draggedItemIndex = null;

      });


      element.addEventListener("dragover", function(event) {

        event.preventDefault();

        if (!draggedElement || draggedElement === element) {
          return;
        }

        if (draggedSection !== section) {
          return;
        }

        if (draggedType !== type) {
          return;
        }

        if (
          type === "link" &&
          draggedFolderIndex !== folderIndex
        ) {
          return;
        }

        element.classList.add("drag-over");

        const rect = element.getBoundingClientRect();
        const middle = rect.top + rect.height / 2;

        if (event.clientY < middle) {

          element.parentNode.insertBefore(
            draggedElement,
            element
          );

        } else {

          element.parentNode.insertBefore(
            draggedElement,
            element.nextSibling
          );

        }

      });


      element.addEventListener("dragleave", function() {
        element.classList.remove("drag-over");
      });


      element.addEventListener("drop", function(event) {

        event.preventDefault();

        if (!draggedElement) {
          return;
        }

        element.classList.remove("drag-over");

        reorderItems(
          draggedSection,
          draggedType,
          draggedFolderIndex,
          draggedItemIndex,
          section,
          folderIndex,
          itemIndex
        );

      });

    }


    /* REORDER */

    function reorderItems(
      fromSection,
      fromType,
      fromFolderIndex,
      fromItemIndex,
      toSection,
      toFolderIndex,
      toItemIndex
    ) {

      if (fromSection !== toSection) {
        return;
      }


      if (fromType === "link") {

        if (fromFolderIndex !== toFolderIndex) {
          return;
        }

        const collection =
          fromFolderIndex === null
            ? data[fromSection]
            : data[fromSection][fromFolderIndex].links;

        const [moved] = collection.splice(fromItemIndex, 1);

        let newIndex = toItemIndex;

        if (fromItemIndex < toItemIndex) {
          newIndex--;
        }

        collection.splice(newIndex, 0, moved);
      }


      if (fromType === "folder") {

        const [moved] = data[fromSection].splice(
          fromItemIndex,
          1
        );

        let newIndex = toItemIndex;

        if (fromItemIndex < toItemIndex) {
          newIndex--;
        }

        data[fromSection].splice(newIndex, 0, moved);
      }


      saveData();
      renderAll();

    }


    /* LINK MODAL */

    function openLinkModal(section, folderIndex = null) {

      currentSection = section;
      currentFolderIndex = folderIndex;

      const modal = document.getElementById("linkModal");

      const card = document.querySelector(
        `.page-card[data-section="${section}"]`
      );

      const accent = getComputedStyle(card)
        .getPropertyValue("--accent")
        .trim();

      modal.querySelector(".save-btn").style.setProperty(
        "--modal-accent",
        accent
      );

      document.getElementById("websiteName").value = "";
      document.getElementById("websiteUrl").value = "";

      modal.classList.add("active");

      setTimeout(function() {
        document.getElementById("websiteName").focus();
      }, 100);

    }


    function closeLinkModal() {

      document
        .getElementById("linkModal")
        .classList.remove("active");

      currentSection = null;
      currentFolderIndex = null;

    }


    function saveLink() {

      const nameInput = document.getElementById("websiteName");
      const urlInput = document.getElementById("websiteUrl");

      const name = nameInput.value.trim();
      const url = normalizeUrl(urlInput.value);

      if (!name) {
        alert("Please enter a website name.");
        nameInput.focus();
        return;
      }

      if (!url) {
        alert("Please enter a website URL.");
        urlInput.focus();
        return;
      }


      if (currentFolderIndex === null) {

        data[currentSection].push({
          type: "link",
          name: name,
          url: url
        });

      } else {

        data[currentSection][currentFolderIndex].links.push({
          name: name,
          url: url
        });

      }


      saveData();
      renderAll();
      closeLinkModal();

    }


    /* FOLDER MODAL */

    function openFolderModal(section) {

      currentSection = section;

      const modal = document.getElementById("folderModal");

      const card = document.querySelector(
        `.page-card[data-section="${section}"]`
      );

      const accent = getComputedStyle(card)
        .getPropertyValue("--accent")
        .trim();

      modal.querySelector(".save-btn").style.setProperty(
        "--modal-accent",
        accent
      );

      document.getElementById("folderName").value = "";

      modal.classList.add("active");

      setTimeout(function() {
        document.getElementById("folderName").focus();
      }, 100);

    }


    function closeFolderModal() {

      document
        .getElementById("folderModal")
        .classList.remove("active");

      currentSection = null;

    }


    function saveFolder() {

      const nameInput = document.getElementById("folderName");
      const name = nameInput.value.trim();

      if (!name) {
        alert("Please enter a folder name.");
        nameInput.focus();
        return;
      }


      data[currentSection].push({
        type: "folder",
        name: name,
        links: []
      });


      saveData();
      renderAll();
      closeFolderModal();

    }


    /* DELETE LINK */

    function deleteLink(
      section,
      linkIndex,
      folderIndex = null
    ) {

      const shouldDelete = confirm(
        "Are you sure you want to delete this link?"
      );

      if (!shouldDelete) {
        return;
      }


      if (folderIndex === null) {

        data[section].splice(linkIndex, 1);

      } else {

        const folder = data[section][folderIndex];

        if (folder && Array.isArray(folder.links)) {
          folder.links.splice(linkIndex, 1);
        }

      }


      saveData();
      renderAll();

    }


    /* DELETE FOLDER */

    function deleteFolder(section, folderIndex) {

      const shouldDelete = confirm(
        "Delete this folder and all links inside it?"
      );

      if (!shouldDelete) {
        return;
      }


      if (
        data[section] &&
        data[section][folderIndex]
      ) {
        data[section].splice(folderIndex, 1);
      }


      saveData();
      renderAll();

    }


    /* ADD LINK BUTTONS */

    document.querySelectorAll(".add-link-btn").forEach(function(button) {

      button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openLinkModal(button.dataset.section);

      });

    });


    /* CREATE FOLDER BUTTONS */

    document.querySelectorAll(".create-folder-btn").forEach(function(button) {

      button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        openFolderModal(button.dataset.section);

      });

    });


    /* MODAL BUTTONS */

    document
      .getElementById("cancelLinkBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeLinkModal();

      });


    document
      .getElementById("saveLinkBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        saveLink();

      });


    document
      .getElementById("cancelFolderBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        closeFolderModal();

      });


    document
      .getElementById("saveFolderBtn")
      .addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        saveFolder();

      });


    /* ENTER KEY SUPPORT */

    document
      .getElementById("websiteName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          document.getElementById("websiteUrl").focus();
        }

      });


    document
      .getElementById("websiteUrl")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          saveLink();
        }

      });


    document
      .getElementById("folderName")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          saveFolder();
        }

      });


    /* CLOSE MODALS OUTSIDE CLICK */

    document
      .getElementById("linkModal")
      .addEventListener("click", function(event) {

        if (event.target.id === "linkModal") {
          closeLinkModal();
        }

      });


    document
      .getElementById("folderModal")
      .addEventListener("click", function(event) {

        if (event.target.id === "folderModal") {
          closeFolderModal();
        }

      });



    /* SYNC & BACKUP */
    function updateBackupStatus(message) {
      const status = document.getElementById("backupStatus");
      if (status) status.textContent = message;
    }

    function exportBackup() {
      const backup = {
        app: "DAILY x HUB",
        version: 1,
        exportedAt: new Date().toISOString(),
        data: data
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `daily-x-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      updateBackupStatus("Backup exported successfully");
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          const imported = parsed.data || parsed;
          const clean = JSON.parse(JSON.stringify(defaultData));

          Object.keys(clean).forEach(section => {
            if (!Array.isArray(imported[section])) return;
            clean[section] = imported[section].map(item => {
              if (item.type === "folder") {
                return {
                  type: "folder",
                  name: item.name || "Untitled Folder",
                  links: Array.isArray(item.links)
                    ? item.links.map(link => ({
                        name: link.name || "Untitled Link",
                        url: normalizeUrl(link.url || "")
                      }))
                    : []
                };
              }
              return {
                type: "link",
                name: item.name || "Untitled Link",
                url: normalizeUrl(item.url || "")
              };
            });
          });

          if (!confirm("Import this backup and replace current data?")) return;
          data = clean;
          saveData();
          renderAll();
          updateBackupStatus("Backup imported successfully");
        } catch (error) {
          console.error(error);
          alert("Invalid backup file. Please select a DAILY x HUB JSON backup.");
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("exportBackupBtn").addEventListener("click", exportBackup);
    document.getElementById("importBackupBtn").addEventListener("click", function() {
      document.getElementById("backupFileInput").click();
    });
    document.getElementById("backupFileInput").addEventListener("change", function(event) {
      importBackup(event.target.files[0]);
      event.target.value = "";
    });


    /* SYNC & BACKUP MODAL */

    function updateSyncStatus(message) {
      const status = document.getElementById("syncModalStatus");
      if (status) status.textContent = message;
      const oldStatus = document.getElementById("backupStatus");
      if (oldStatus) oldStatus.textContent = message;
    }

    function openSyncModal() {
      document.getElementById("syncModal").classList.add("active");
    }

    function closeSyncModal() {
      document.getElementById("syncModal").classList.remove("active");
    }

    document.getElementById("syncBackupBtn").addEventListener("click", openSyncModal);
    document.getElementById("closeSyncBtn").addEventListener("click", closeSyncModal);

    document.getElementById("syncModal").addEventListener("click", function(event) {
      if (event.target.id === "syncModal") closeSyncModal();
    });

    document.getElementById("modalExportBackupBtn").addEventListener("click", exportBackup);

    document.getElementById("modalImportBackupBtn").addEventListener("click", function() {
      document.getElementById("modalBackupFileInput").click();
    });

    document.getElementById("modalBackupFileInput").addEventListener("change", function(event) {
      importBackup(event.target.files[0]);
      event.target.value = "";
    });

    document.getElementById("googleSignInBtn").addEventListener("click", function() {
      alert("Google cloud sync requires Firebase Authentication and Firestore configuration. Export and Import Backup are ready to use locally.");
    });

    /* INITIALIZE */

    setDate();
    renderAll();

  </script>
